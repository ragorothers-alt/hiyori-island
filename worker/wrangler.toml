# 線上同步後端。部署：在這個資料夾執行 npx wrangler@4 deploy（資料表變更：npx wrangler@4 d1 migrations apply hiyori-sync --remote）
name = "hiyori-sync"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "hiyori-sync"
database_id = "10ee1924-6221-4fea-aa25-6f877d7d6855"
migrations_dir = "migrations"

# 每個 IP 每分鐘的請求上限（namespace_id 在整個 Cloudflare 帳號裡不能重複）
[[ratelimits]]
name = "SYNC_LIMIT"
namespace_id = "2001"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "CREATE_LIMIT"
namespace_id = "2002"
simple = { limit = 5, period = 60 }

# 番茄鐘到點的推播（/v1/push/*，見 src/push.js）：Durable Object 用 alarm 到點送出，也保管自己產生的 VAPID 金鑰。
# 不用設 secret。推播服務要一個聯絡網址，預設用這個 Worker 自己的網址；要換的話加 [vars] PUSH_CONTACT = "https://…"
# 每個 IP 每分鐘 40 次（開始、暫停、繼續、停掉各一次）；整個伺服器一天最多排 5000 則（[vars] PUSH_DAILY 可改，取消不算）
[[durable_objects.bindings]]
name = "PUSH"
class_name = "PushHub"

[[ratelimits]]
name = "PUSH_LIMIT"
namespace_id = "2004"
simple = { limit = 40, period = 60 }

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PushHub"]

# ふじ的 AI（/v1/ai）：Claude API 金鑰和通行碼都是 secret，要自己在這個資料夾設定：
#   npx wrangler@4 secret put ANTHROPIC_API_KEY
#   npx wrangler@4 secret put AI_PASS
# 預設模型是 claude-opus-5-5；要換的話加 [vars] AI_MODEL = "claude-sonnet-5-5"（前端設定裡也能選）
[[ratelimits]]
name = "AI_LIMIT"
namespace_id = "2003"
simple = { limit = 10, period = 60 }
