# ひより日和 · 推上 main（或手動執行）時：跑單元測試和瀏覽器端對端測試、建置 dist/，都過了才發布到 GitHub Pages
name: 建置並發布到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 測試
        run: npm test
      - name: 建置 dist/
        run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # 瀏覽器端對端測試（離線、自動更新）：沒過就不發布
  e2e:
    runs-on: ubuntu-latest
    # apt 偶爾卡住：裝瀏覽器最多等 8 分鐘、整個工作 20 分鐘，失敗了重跑就好，不要卡到預設的 6 小時
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps --only-shell chromium
        timeout-minutes: 8
      - name: 端對端測試
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results
          path: e2e/.out/results
          retention-days: 7

  deploy:
    needs: [build, e2e]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
