# ひより日和 · 開 PR（或更新 PR）時：跑單元測試和瀏覽器端對端測試、確認建置得起來。不發布（發布在 pages.yml，推上 main 才跑）
name: 測試與建置（PR）

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 測試
        run: npm test
      - name: 建置
        run: npm run build

  # 瀏覽器端對端測試：離線、自動更新（e2e/，用 Playwright 開 Chromium）。
  # CI 的機器一次只跑得動一個（見 playwright.config.js），整套一台跑要 20 分鐘以上：分成三台同時跑，每台一份
  e2e:
    runs-on: ubuntu-latest
    # apt 偶爾卡住：裝瀏覽器最多等 8 分鐘、整個工作 25 分鐘，失敗了重跑就好，不要卡到預設的 6 小時
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps --only-shell chromium
        timeout-minutes: 8
      - name: 端對端測試
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/3
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results-${{ matrix.shard }}
          path: e2e/.out/results
          retention-days: 7
